<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-labelledby="t d">
  <title id="t">Agente de citas para Telegram y web</title>
  <desc id="d">Banner del proyecto con el logo de la Clínica Alba, centro médico ficticio de la demo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1433"/>
      <stop offset="1" stop-color="#241a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".14" cy=".55" r=".4">
      <stop offset="0" stop-color="#ff6b5b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff6b5b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".92" cy=".1" r=".45">
      <stop offset="0" stop-color="#7c4dff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="linea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d8b"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <!-- Logo de la Clínica Alba (mismo dibujo que panel/public/favicon.svg) -->
    <linearGradient id="ca-sol" gradientUnits="userSpaceOnUse" x1="0" y1="11" x2="0" y2="37">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".3" stop-color="#ffbf6e"/>
      <stop offset=".62" stop-color="#ff8f78"/>
      <stop offset="1" stop-color="#ff4f8f"/>
    </linearGradient>
    <radialGradient id="ca-halo" gradientUnits="userSpaceOnUse" cx="24" cy="34" r="24">
      <stop offset=".6" stop-color="#ffb36b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ca-horizonte" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d8b"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <clipPath id="ca-cielo"><path d="M0 0H48V39Q24 31 0 39Z"/></clipPath>
  </defs>

  <rect width="1280" height="240" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="240" rx="16" fill="url(#glow)"/>
  <rect width="1280" height="240" rx="16" fill="url(#glow2)"/>

  <!-- Logo -->
  <g transform="translate(86 52) scale(2.8)">
    <g clip-path="url(#ca-cielo)">
      <circle cx="24" cy="35" r="24" fill="url(#ca-halo)"/>
      <circle cx="24" cy="35" r="21" fill="url(#ca-sol)"/>
    </g>
    <path d="M1 40Q24 30.6 47 40Q24 35.2 1 40Z" fill="url(#ca-horizonte)"/>
    <path d="M22.1 18h3.8v5h5v3.8h-5v5h-3.8v-5h-5V23h5z" fill="#ff3d8b" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" paint-order="stroke"/>
  </g>

  <!-- Texto -->
  <text x="290" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="700" fill="#fbf9ff">Agente de citas</text>
  <text x="292" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#fbf9ff" fill-opacity=".72">para Telegram y web · con IA y traspaso a una persona</text>
  <rect x="292" y="168" width="300" height="3" rx="1.5" fill="url(#linea)"/>

  <!-- Canales -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600">
    <rect x="292" y="188" width="104" height="30" rx="15" fill="#00c2d1" fill-opacity=".16" stroke="#00c2d1" stroke-opacity=".6"/>
    <text x="344" y="209" text-anchor="middle" fill="#7fe7ef">Telegram</text>
    <rect x="406" y="188" width="104" height="30" rx="15" fill="#ff3d8b" fill-opacity=".16" stroke="#ff3d8b" stroke-opacity=".6"/>
    <text x="458" y="209" text-anchor="middle" fill="#ff9cc3">Chat web</text>
    <rect x="520" y="188" width="104" height="30" rx="15" fill="#7c4dff" fill-opacity=".18" stroke="#7c4dff" stroke-opacity=".7"/>
    <text x="572" y="209" text-anchor="middle" fill="#c4b0ff">Panel</text>
  </g>

  <text x="1200" y="214" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#fbf9ff" fill-opacity=".45">Demo: Clínica Alba, centro médico ficticio</text>
</svg>
